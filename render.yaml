databases:
  - name: nextill-db
    databaseName: nextill_db
    user: nextill_user
    plan: free # Change to 'starter' if you want persistent backups & no 30-day limit

services:
  - type: web
    name: nextill
    env: node
    plan: free # Change to 'starter' for 0ms cold starts & persistent disk
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nextill-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: STORE_NAME
        value: SKR Stores
      - key: STORE_ADDRESS
        value: Colombo, Kalmunai
      - key: STORE_PHONE
        value: 075 295 8134
      - key: TAX_RATE
        value: "0"
      - key: LOYALTY_POINTS_RATE
        value: "10"
